# ==============================================================================
# ShipFlowX Enterprise CI/CD Pipeline - Infrastructure Deployment
# ==============================================================================
# This pipeline orchestrates Terraform infrastructure deployments in 4 distinct 
# stages (Init, Validate, Plan, Apply).
# ==============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/*

pool:
  vmImage: 'ubuntu-latest'

# ==============================================================================
# Pipeline Variables
# ==============================================================================
variables:
  # The name of the Azure Resource Manager Service Connection configured in Azure DevOps
  azureServiceConnection: 'ShipFlowX-Azure'
  terraformVersion: 'latest'

stages:
  # ==========================================================================
  # Stage 1: Terraform Init
  # ==========================================================================
  - stage: Terraform_Init
    displayName: 'Terraform Init'
    jobs:
      - job: Init
        displayName: 'Terraform Init'
        steps:
          # Install official Terraform binary
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          # Print version for audit validation
          - script: terraform version
            displayName: 'Print Terraform Version'

          # Run init
          - script: |
              cd terraform
              terraform init -backend=false
              echo "Terraform initialized successfully."
            displayName: 'Run terraform init'

  # ==========================================================================
  # Stage 2: Terraform Validate
  # ==========================================================================
  - stage: Terraform_Validate
    displayName: 'Terraform Validate'
    dependsOn: Terraform_Init
    jobs:
      - job: Validate
        displayName: 'Terraform Validate'
        steps:
          # Install official Terraform binary
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          # Print version for audit validation
          - script: terraform version
            displayName: 'Print Terraform Version'

          # Run validation
          - script: |
              cd terraform
              terraform init -backend=false
              terraform validate
              echo "Terraform syntax validation succeeded."
            displayName: 'Run terraform validate'

  # ==========================================================================
  # Stage 3: Terraform Plan
  # ==============================================================================
  - stage: Terraform_Plan
    displayName: 'Terraform Plan'
    dependsOn: Terraform_Validate
    jobs:
      - job: Plan
        displayName: 'Terraform Plan'
        steps:
          # Install official Terraform binary
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          # Print version for audit validation
          - script: terraform version
            displayName: 'Print Terraform Version'

          # AzureCLI@2 is used for authenticated dry-run planning
          - task: AzureCLI@2
            displayName: 'Run terraform plan'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd terraform
                terraform init -backend=false
                terraform plan -out=$(Build.ArtifactStagingDirectory)/tfplan

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Plan Artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
              artifactName: 'tfplan-artifact'
              publishLocation: 'pipeline'

  # ==========================================================================
  # Stage 4: Terraform Apply
  # ==========================================================================
  - stage: Terraform_Apply
    displayName: 'Terraform Apply'
    dependsOn: Terraform_Plan
    condition: succeeded()
    jobs:
      - job: Apply
        displayName: 'Terraform Apply'
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Plan Artifact'
            inputs:
              buildType: 'current'
              artifactName: 'tfplan-artifact'
              targetPath: '$(Pipeline.Workspace)/tfplan-artifact'

          # Install official Terraform binary
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          # Print version for audit validation
          - script: terraform version
            displayName: 'Print Terraform Version'

          # AzureCLI@2 is used for authenticated resource deployment
          - task: AzureCLI@2
            displayName: 'Run terraform apply'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                cd terraform
                terraform init -backend=false
                terraform apply -auto-approve $(Pipeline.Workspace)/tfplan-artifact/tfplan
