# ==============================================================================
# ShipFlowX Enterprise CI/CD Pipeline - Infrastructure Deployment
# ==============================================================================
# This pipeline orchestrates Terraform infrastructure deployments in 4 distinct 
# stages (Init, Validate, Plan, Apply) using official Azure Pipeline tasks.
# ==============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/*

pool:
  vmImage: 'ubuntu-latest'

# ==============================================================================
# Pipeline Variables
# ==============================================================================
variables:
  # The name of the Azure Resource Manager Service Connection configured in Azure DevOps
  azureServiceConnection: 'ShipFlowX-Azure'
  terraformVersion: 'latest'

stages:
  # ==========================================================================
  # Stage 1: Terraform Init
  # ==========================================================================
  - stage: Terraform_Init
    displayName: 'Terraform Init'
    jobs:
      - job: Init
        displayName: 'Terraform Init'
        steps:
          # Install official Terraform binary on the agent
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          # Print version for audit validation
          - script: terraform version
            displayName: 'Print Terraform Version'

          # Run init natively using official Terraform task
          - task: TerraformTaskV4@4
            displayName: 'Execute Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              commandOptions: '-backend=false'

  # ==========================================================================
  # Stage 2: Terraform Validate
  # ==========================================================================
  - stage: Terraform_Validate
    displayName: 'Terraform Validate'
    dependsOn: Terraform_Init
    jobs:
      - job: Validate
        displayName: 'Terraform Validate'
        steps:
          # Install official Terraform binary on the agent
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          # Print version for audit validation
          - script: terraform version
            displayName: 'Print Terraform Version'

          # Initialize local providers and validate syntax
          - task: TerraformTaskV4@4
            displayName: 'Execute Init for Validation'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              commandOptions: '-backend=false'

          - task: TerraformTaskV4@4
            displayName: 'Execute Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

  # ==========================================================================
  # Stage 3: Terraform Plan
  # ==========================================================================
  - stage: Terraform_Plan
    displayName: 'Terraform Plan'
    dependsOn: Terraform_Validate
    jobs:
      - job: Plan
        displayName: 'Terraform Plan'
        steps:
          # Install official Terraform binary on the agent
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          # Print version for audit validation
          - script: terraform version
            displayName: 'Print Terraform Version'

          # Initialize and generate plan using the ARM service connection
          - task: TerraformTaskV4@4
            displayName: 'Execute Init for Plan'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              commandOptions: '-backend=false'

          - task: TerraformTaskV4@4
            displayName: 'Execute Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              commandOptions: '-backend=false -out=$(Build.ArtifactStagingDirectory)/tfplan'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Plan Artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
              artifactName: 'tfplan-artifact'
              publishLocation: 'pipeline'

  # ==========================================================================
  # Stage 4: Terraform Apply
  # ==========================================================================
  - stage: Terraform_Apply
    displayName: 'Terraform Apply'
    dependsOn: Terraform_Plan
    condition: succeeded()
    jobs:
      - job: Apply
        displayName: 'Terraform Apply'
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Plan Artifact'
            inputs:
              buildType: 'current'
              artifactName: 'tfplan-artifact'
              targetPath: '$(Pipeline.Workspace)/tfplan-artifact'

          # Install official Terraform binary on the agent
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          # Print version for audit validation
          - script: terraform version
            displayName: 'Print Terraform Version'

          # Initialize and apply plan using the ARM service connection
          - task: TerraformTaskV4@4
            displayName: 'Execute Init for Apply'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              commandOptions: '-backend=false'

          - task: TerraformTaskV4@4
            displayName: 'Execute Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
              commandOptions: '-backend=false -auto-approve $(Pipeline.Workspace)/tfplan-artifact/tfplan'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
